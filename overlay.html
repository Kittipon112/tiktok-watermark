<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dynamic Watermark Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      -webkit-font-smoothing: antialiased;
      pointer-events: none; /* Never block mouse events on live stream */
      user-select: none;
    }

    #overlay-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
    }

    #watermark-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
      pointer-events: none;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 8px;
    }

    /* Watermark Image */
    #watermark-img {
      display: none;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    /* Watermark Text & Clock */
    #watermark-text {
      display: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji';
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6), 0 0 8px rgba(0,0,0,0.4);
      line-height: 1.2;
    }

    #watermark-clock {
      display: none;
      font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6), 0 0 8px rgba(0,0,0,0.4);
      line-height: 1.2;
    }

    /* Anti-loop dynamic micro entropy token */
    #watermark-entropy {
      display: none;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 0.65em;
      opacity: 0.8;
      letter-spacing: 1.5px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="overlay-container">
    <div id="watermark-wrapper">
      <img id="watermark-img" alt="Watermark" />
      <span id="watermark-text"></span>
      <span id="watermark-clock"></span>
      <span id="watermark-entropy"></span>
    </div>
  </div>

  <script>
    (function() {
      // Parse Query Parameters
      const params = new URLSearchParams(window.location.search);
      
      // Configuration with defaults
      const config = {
        type: params.get('type') || 'clock', // 'clock' | 'text' | 'image' | 'hybrid' | 'code'
        text: params.get('text') || 'LIVE STREAM',
        img: params.get('img') || '',
        opacity: parseFloat(params.get('opacity')) || 0.15,
        interval: Math.max(1, parseFloat(params.get('interval')) || 4.0), // seconds between movements
        transition: Math.max(0.5, parseFloat(params.get('transition')) || 3.0), // transition speed in seconds
        size: parseFloat(params.get('size')) || 100, // size in px (image width or base font multiplier)
        fontSize: parseFloat(params.get('fontSize')) || 24, // text font size in px
        color: params.get('color') || '#ffffff',
        safeZone: Math.min(30, Math.max(0, parseFloat(params.get('safeZone')) || 5)), // edge margin %
        showEntropy: params.get('entropy') === 'true' || params.get('antiloop') === 'true', // anti-loop hash
        clockFormat: params.get('format') || 'time', // 'time' (HH:mm:ss) | 'full' (YYYY-MM-DD HH:mm:ss) | 'ms' (HH:mm:ss.SS)
        glow: params.get('glow') !== 'false'
      };

      // DOM Elements
      const wrapper = document.getElementById('watermark-wrapper');
      const imgEl = document.getElementById('watermark-img');
      const textEl = document.getElementById('watermark-text');
      const clockEl = document.getElementById('watermark-clock');
      const entropyEl = document.getElementById('watermark-entropy');

      // Apply Base Styles
      wrapper.style.opacity = config.opacity;
      wrapper.style.transition = `transform ${config.transition}s cubic-bezier(0.25, 1, 0.5, 1)`;

      if (!config.glow) {
        textEl.style.textShadow = 'none';
        clockEl.style.textShadow = 'none';
        imgEl.style.filter = 'none';
      }

      // Setup Content Based on Type
      const isClock = config.type === 'clock' || config.type === 'hybrid';
      const isText = (config.type === 'text' || config.type === 'hybrid') && config.text;
      const isImage = (config.type === 'image' || config.type === 'hybrid') && config.img;
      const isCode = config.type === 'code';

      if (isImage) {
        imgEl.src = config.img;
        imgEl.style.width = config.size + 'px';
        imgEl.style.height = 'auto';
        imgEl.style.display = 'block';
      }

      if (isText) {
        textEl.textContent = config.text;
        textEl.style.fontSize = config.fontSize + 'px';
        textEl.style.color = config.color;
        textEl.style.display = 'block';
      }

      if (isClock || isCode) {
        clockEl.style.fontSize = config.fontSize + 'px';
        clockEl.style.color = config.color;
        clockEl.style.display = 'block';
      }

      if (config.showEntropy || isCode) {
        entropyEl.style.color = config.color;
        entropyEl.style.display = 'block';
      }

      // Real-time Clock & Entropy Updater
      function updateClock() {
        const now = new Date();
        const pad = (n, len = 2) => String(n).padStart(len, '0');
        
        if (isClock) {
          const hh = pad(now.getHours());
          const mm = pad(now.getMinutes());
          const ss = pad(now.getSeconds());

          if (config.clockFormat === 'ms') {
            const ms = pad(Math.floor(now.getMilliseconds() / 10));
            clockEl.textContent = `${hh}:${mm}:${ss}.${ms}`;
          } else if (config.clockFormat === 'full') {
            const yyyy = now.getFullYear();
            const mo = pad(now.getMonth() + 1);
            const dd = pad(now.getDate());
            clockEl.textContent = `${yyyy}-${mo}-${dd} ${hh}:${mm}:${ss}`;
          } else {
            clockEl.textContent = `${hh}:${mm}:${ss}`;
          }
        }

        if (isCode) {
          // Micro forensic ID simulation
          const hex = Math.floor(now.getTime() % 16777215).toString(16).toUpperCase().padStart(6, '0');
          clockEl.textContent = `#${hex}`;
        }

        if (config.showEntropy) {
          // Dynamic noise hash that changes every frame/second to break AI spatio-temporal hash
          const hash = Math.random().toString(36).substring(2, 8).toUpperCase();
          entropyEl.textContent = `TRACE-${hash}`;
        }
      }

      // Clock Interval: 100ms for ms format, 500ms for standard
      const clockInterval = config.clockFormat === 'ms' ? 80 : 500;
      updateClock();
      setInterval(updateClock, clockInterval);

      // Smooth Random Position Generator
      let currentX = 0;
      let currentY = 0;

      function getRandomCoordinates() {
        const viewW = window.innerWidth || document.documentElement.clientWidth || 1080;
        const viewH = window.innerHeight || document.documentElement.clientHeight || 1920;
        
        const elemW = wrapper.offsetWidth || 150;
        const elemH = wrapper.offsetHeight || 50;

        const marginX = (viewW * config.safeZone) / 100;
        const marginY = (viewH * config.safeZone) / 100;

        const minX = marginX;
        const maxX = Math.max(minX, viewW - elemW - marginX);

        const minY = marginY;
        const maxY = Math.max(minY, viewH - elemH - marginY);

        // Ensure minimum travel distance so it doesn't just vibrate in place
        let targetX, targetY, distance;
        let attempts = 0;
        const minDistance = Math.min(viewW, viewH) * 0.2; // at least 20% of screen distance

        do {
          targetX = minX + Math.random() * (maxX - minX);
          targetY = minY + Math.random() * (maxY - minY);
          const dx = targetX - currentX;
          const dy = targetY - currentY;
          distance = Math.sqrt(dx * dx + dy * dy);
          attempts++;
        } while (distance < minDistance && attempts < 10);

        return { x: Math.round(targetX), y: Math.round(targetY) };
      }

      function moveWatermark() {
        const { x, y } = getRandomCoordinates();
        currentX = x;
        currentY = y;
        wrapper.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      }

      // Initial positioning after rendering
      window.addEventListener('load', () => {
        setTimeout(() => {
          moveWatermark();
          setInterval(moveWatermark, config.interval * 1000);
        }, 100);
      });

      // Handle screen resize (e.g. OBS source resolution changes)
      window.addEventListener('resize', () => {
        moveWatermark();
      });

    })();
  </script>
</body>
</html>
